name: Dependências (para desenvolvimento)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Empacotar node_modules num ramo separado
        run: |
          tar -czf /tmp/nm.tgz node_modules package-lock.json
          mkdir /tmp/v && cd /tmp/v && split -b 45m /tmp/nm.tgz nm.tgz.part-
          git init -q && git checkout -q -b vendor
          git config user.name "ulisses-ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "node_modules"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" vendor
