name: Banco de dados
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir segredos
        run: |
          for v in SUPABASE_DB_URL SERVICE_KEY ADMIN_EMAIL ADMIN_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Segredo ausente: $v"; exit 1; fi
          done
      - name: Instalar psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Aplicar migrações
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Criar ou atualizar a conta de administração
        run: |
          set -e
          URL=$(node -e "const fs=require('fs');const m=fs.readFileSync('.env.production','utf8').match(/VITE_SUPABASE_URL=(.*)/);console.log(m?m[1].trim():'')")
          if [ -z "$URL" ]; then echo "::error::VITE_SUPABASE_URL ausente em .env.production"; exit 1; fi
          BODY=$(node -e "console.log(JSON.stringify({email:process.env.ADMIN_EMAIL,password:process.env.ADMIN_PASSWORD,email_confirm:true}))")
          CODE=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$URL/auth/v1/admin/users" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" -H 'Content-Type: application/json' -d "$BODY")
          echo "criar usuário: HTTP $CODE"
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            grep -qi 'already' /tmp/r.json && echo "usuário já existe" || { cat /tmp/r.json; exit 1; }
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -v email="$ADMIN_EMAIL" <<'SQL'
          insert into public.admins (user_id) select id from auth.users where lower(email) = lower(:'email') on conflict do nothing;
          SQL
          psql "$SUPABASE_DB_URL" -At -c "select 'administradores: ' || count(*) from public.admins;"
      - name: Resumo
        run: psql "$SUPABASE_DB_URL" -At -c "select slug || ' | ' || status || ' | teste=' || is_demo from public.events order by created_at;"
